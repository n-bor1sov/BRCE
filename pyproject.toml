[project]
name = "brce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "compressed-tensors>=0.12.2",
    "datasets<4",
    "graphviz>=0.21",
    "hf-transfer>=0.1.9",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "ir-datasets>=0.5.11",
    "jsonlines>=4.0.0",
    "mxbai-rerank>=0.1.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "sentence-transformers>=5.2.0",
    "torch>=2.8.0",
    "torchview>=0.2.7",
    "transformers>=4.56.1",
    "vllm>=0.12.0",
    "zstandard>=0.25.0",
]



[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep Ruff's default rule set, and add more on top.
extend-select = [
  "I",    # import sorting (isort)
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "A",    # builtins shadowing
  "ARG",  # unused arguments
  "RUF",  # Ruff-specific rules
]

# Commonly ignored in many codebases (optional):
ignore = [
  "E501", # line length (formatter will handle wrapping where possible)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # allow `assert` in tests (if you later enable Bandit rules)
  "ARG001",
  "ARG002",
]
